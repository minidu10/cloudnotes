server {
    listen 80;

    # 1. React website
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # 2. Forward API calls to the API container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Health check passes through too
    location /health {
        proxy_pass http://api:3000/health;
    }

    # 4. Metrics are internal only (scraped as api:3000/metrics inside Docker).
    #    Without this block, the React fallback above would answer with index.html.
    location /metrics {
        return 404;
    }
}